[package]
name = "obamify"
version = "0.3.0"
authors = ["Spu7Nix"]
edition = "2021"
include = ["LICENSE-MIT", "**/*.rs", "Cargo.toml"]
rust-version = "1.85"

[lib]
crate-type = ["cdylib"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
image = { version = "0.25.6", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "js", "serde"] }
serde = { version = "1.0.219", features = ["derive"] }
wasm-bindgen = "0.2.100"
console_error_panic_hook = "0.1.7"
serde-wasm-bindgen = "0.6.5"
web-sys = { version = "0.3.77", features = [
  "DedicatedWorkerGlobalScope", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent", "console"
] }
pathfinding = "4.14.0"
indexmap = "2.11.0"
frand = "0.10.1"
rustc-hash = "2.1.1"
wgpu = { version = "0.19.2", default-features = false, features = ["wgsl"] }
bytemuck = { version = "1.23.1", features = ["derive"] }
pollster = "0.3.0"
futures-intrusive = "0.5.0"
wasm-bindgen-futures = "0.4.50"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
